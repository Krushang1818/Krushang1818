<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Krushang Desai - Generative AI Developer</title>
  <desc id="desc">Animated neon banner combining a neural network, terminal interface, and chess knight.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#07152b;#020617" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.48" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#172554;#0f172a" dur="11s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#2e1065;#111827" dur="13s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="cyanHalo">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetHalo">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.1 0;0.1 0;-0.1 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.20" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <pattern id="board" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#0f172a" />
      <rect width="28" height="28" fill="#164e63" />
      <rect x="28" y="28" width="28" height="28" fill="#4c1d95" />
    </pattern>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="18" y="18" width="1164" height="324" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <rect x="18" y="18" width="1164" height="324" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75" />
  <rect x="30" y="30" width="1140" height="300" rx="20" fill="url(#grid)" />

  <g clip-path="url(#frameClip)">
    <circle cx="160" cy="185" r="210" fill="url(#cyanHalo)">
      <animate attributeName="r" values="175;225;175" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="178" r="205" fill="url(#violetHalo)">
      <animate attributeName="r" values="185;230;185" dur="10s" repeatCount="indefinite" />
    </circle>

    <g opacity="0.55">
      <circle cx="94" cy="330" r="2.2" fill="#22d3ee">
        <animate attributeName="cy" values="330;28" dur="6.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="6.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="275" cy="330" r="1.8" fill="#8b5cf6">
        <animate attributeName="cy" values="330;22" dur="8.2s" begin="-3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="8.2s" begin="-3s" repeatCount="indefinite" />
      </circle>
      <circle cx="430" cy="330" r="1.6" fill="#ec4899">
        <animate attributeName="cy" values="330;18" dur="7.5s" begin="-5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="-5s" repeatCount="indefinite" />
      </circle>
      <circle cx="685" cy="330" r="2" fill="#22d3ee">
        <animate attributeName="cy" values="330;26" dur="9.1s" begin="-2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="9.1s" begin="-2s" repeatCount="indefinite" />
      </circle>
      <circle cx="820" cy="330" r="1.5" fill="#8b5cf6">
        <animate attributeName="cy" values="330;24" dur="6.8s" begin="-4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="6.8s" begin="-4s" repeatCount="indefinite" />
      </circle>
      <circle cx="1110" cy="330" r="2.2" fill="#ec4899">
        <animate attributeName="cy" values="330;24" dur="8.6s" begin="-6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="8.6s" begin="-6s" repeatCount="indefinite" />
      </circle>
    </g>

    <rect x="25" y="-58" width="1150" height="76" fill="url(#scan)" opacity="0.75">
      <animate attributeName="y" values="-58;360" dur="5.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <g transform="translate(54 70)">
    <g fill="none" stroke-linecap="round" stroke-width="2.3" opacity="0.85">
      <path d="M36 52 L105 24 L174 58 L226 20" stroke="#22d3ee" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="64;0" dur="2.2s" repeatCount="indefinite" />
      </path>
      <path d="M36 52 L94 112 L174 58 L230 126" stroke="#8b5cf6" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.6s" repeatCount="indefinite" />
      </path>
      <path d="M30 164 L94 112 L166 168 L230 126" stroke="#ec4899" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="64;0" dur="2.9s" repeatCount="indefinite" />
      </path>
      <path d="M30 164 L112 216 L166 168 L230 216" stroke="#22d3ee" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.4s" repeatCount="indefinite" />
      </path>
      <path d="M105 24 L94 112 L112 216" stroke="#38bdf8" stroke-opacity="0.6" stroke-dasharray="5 10">
        <animate attributeName="stroke-dashoffset" values="45;0" dur="3s" repeatCount="indefinite" />
      </path>
      <path d="M174 58 L166 168" stroke="#a78bfa" stroke-opacity="0.7" stroke-dasharray="5 10">
        <animate attributeName="stroke-dashoffset" values="0;-45" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>

    <g filter="url(#glow)">
      <g fill="#22d3ee">
        <circle cx="36" cy="52" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite" /></circle>
        <circle cx="105" cy="24" r="6"><animate attributeName="r" values="6;9;6" dur="3.4s" begin="-1s" repeatCount="indefinite" /></circle>
        <circle cx="230" cy="216" r="6"><animate attributeName="r" values="5;8;5" dur="3.2s" begin="-2s" repeatCount="indefinite" /></circle>
      </g>
      <g fill="#8b5cf6">
        <circle cx="94" cy="112" r="7"><animate attributeName="opacity" values="0.55;1;0.55" dur="2.1s" repeatCount="indefinite" /></circle>
        <circle cx="174" cy="58" r="7"><animate attributeName="opacity" values="1;0.5;1" dur="2.7s" repeatCount="indefinite" /></circle>
        <circle cx="112" cy="216" r="6"><animate attributeName="r" values="5;9;5" dur="3.6s" repeatCount="indefinite" /></circle>
      </g>
      <g fill="#ec4899">
        <circle cx="30" cy="164" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite" /></circle>
        <circle cx="166" cy="168" r="8"><animate attributeName="r" values="7;10;7" dur="3.1s" repeatCount="indefinite" /></circle>
        <circle cx="226" cy="20" r="6"><animate attributeName="opacity" values="1;0.45;1" dur="2.5s" repeatCount="indefinite" /></circle>
        <circle cx="230" cy="126" r="6"><animate attributeName="r" values="5;8;5" dur="2.7s" begin="-1.4s" repeatCount="indefinite" /></circle>
      </g>
    </g>

    <text x="14" y="238" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">NEURAL SIGNAL ONLINE</text>
  </g>

  <g transform="translate(320 92)">
    <text x="0" y="34" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="6">HELLO, I AM</text>
    <text x="0" y="96" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="53" font-weight="800" letter-spacing="2" filter="url(#softGlow)">KRUSHANG DESAI</text>
    <rect x="0" y="116" width="535" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="130;535;130" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="153" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.8">GENERATIVE AI  /  DATA SCIENCE  /  WEB SYSTEMS</text>

    <g transform="translate(0 179)">
      <rect width="520" height="62" rx="13" fill="#020617" fill-opacity="0.76" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="20" r="4" fill="#ec4899" />
      <circle cx="38" cy="20" r="4" fill="#f59e0b" />
      <circle cx="54" cy="20" r="4" fill="#22d3ee" />
      <text x="20" y="46" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; build --intelligence --purpose --human</text>
      <rect x="409" y="34" width="9" height="15" rx="1" fill="#a78bfa">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <g transform="translate(922 65)">
    <rect x="-7" y="-7" width="238" height="238" rx="20" fill="#020617" fill-opacity="0.55" stroke="url(#accent)" stroke-width="2" />
    <rect width="224" height="224" rx="14" fill="url(#board)" opacity="0.82" />
    <path d="M0 74 H224 M0 149 H224 M74 0 V224 M149 0 V224" stroke="#c4b5fd" stroke-opacity="0.10" />
    <circle cx="112" cy="112" r="82" fill="#020617" fill-opacity="0.55" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 112 112" to="360 112 112" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="112" cy="112" r="64" fill="none" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate" from="360 112 112" to="0 112 112" dur="12s" repeatCount="indefinite" />
    </circle>
    <text x="112" y="154" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI Symbol, Noto Sans Symbols, serif" font-size="122" filter="url(#glow)">&#9822;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.8s" repeatCount="indefinite" />
    </text>
    <text x="112" y="246" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">THINK THREE MOVES AHEAD</text>
  </g>

  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">
    <text x="37" y="327">SYS://KRUSHANG.AI</text>
    <text x="1094" y="327">READY</text>
    <circle cx="1077" cy="323" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
