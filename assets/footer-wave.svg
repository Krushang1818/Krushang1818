<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated neon footer</title>
  <desc id="desc">Flowing cyan, violet, and pink waves with a thank-you message.</desc>

  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#22d3ee;#0ea5e9" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#a855f7;#8b5cf6" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#f43f5e;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.28" />
    </linearGradient>

    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="#020617" />
  <rect width="1200" height="2" fill="url(#waveA)" opacity="0.85" />

  <g opacity="0.55">
    <circle cx="125" cy="150" r="2" fill="#22d3ee">
      <animate attributeName="cy" values="160;25;160" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="160" r="1.7" fill="#8b5cf6">
      <animate attributeName="cy" values="165;35;165" dur="8s" begin="-3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="-3s" repeatCount="indefinite" />
    </circle>
    <circle cx="870" cy="155" r="1.8" fill="#ec4899">
      <animate attributeName="cy" values="165;22;165" dur="7s" begin="-4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="-4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="160" r="2" fill="#22d3ee">
      <animate attributeName="cy" values="165;30;165" dur="8.8s" begin="-6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="8.8s" begin="-6s" repeatCount="indefinite" />
    </circle>
  </g>

  <path fill="url(#waveB)" opacity="0.6" d="M0 105 C180 40 350 150 520 95 C720 25 900 155 1200 78 L1200 180 L0 180 Z">
    <animate attributeName="d" values="M0 105 C180 40 350 150 520 95 C720 25 900 155 1200 78 L1200 180 L0 180 Z;M0 82 C180 155 350 30 520 112 C720 168 900 28 1200 112 L1200 180 L0 180 Z;M0 105 C180 40 350 150 520 95 C720 25 900 155 1200 78 L1200 180 L0 180 Z" dur="9s" repeatCount="indefinite" />
  </path>

  <path fill="url(#waveA)" opacity="0.76" d="M0 124 C170 172 335 55 525 125 C710 178 905 56 1200 118 L1200 180 L0 180 Z">
    <animate attributeName="d" values="M0 124 C170 172 335 55 525 125 C710 178 905 56 1200 118 L1200 180 L0 180 Z;M0 145 C170 72 335 168 525 100 C710 42 905 160 1200 90 L1200 180 L0 180 Z;M0 124 C170 172 335 55 525 125 C710 178 905 56 1200 118 L1200 180 L0 180 Z" dur="7.5s" repeatCount="indefinite" />
  </path>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" filter="url(#glow)">
    <text x="600" y="92" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="6">THANKS FOR VISITING
      <animate attributeName="opacity" values="0.68;1;0.68" dur="3.8s" repeatCount="indefinite" />
    </text>
    <text x="600" y="119" fill="#dbeafe" font-size="11" font-weight="600" letter-spacing="3">LET'S BUILD SOMETHING INTELLIGENT</text>
    <rect x="812" y="107" width="8" height="14" rx="1" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
